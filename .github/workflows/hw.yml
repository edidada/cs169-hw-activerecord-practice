name: CS169 hw-activerecord-practice
on:
  push:
    branches: [edidada/cs169-hw]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activerecord:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - name: Install gems (Gemfile.lock pins the exact set)
        run: bundle install --jobs 4
      - name: Run official specs (pending skipped as shipped)
        run: bundle exec rspec --format documentation
      - name: Run full checks with xspecify lifted
        run: |
          ruby -e 'File.write("/tmp/ar_spec.rb", File.read("spec/activerecord_practice_spec.rb").gsub(/\bxspecify\b/, "specify"))'
          bundle exec rspec /tmp/ar_spec.rb --format documentation
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activerecord-results
          path: |
            lib/activerecord_practice.rb
            spec/activerecord_practice_spec.rb
            customers-original.sqlite3
          if-no-files-found: warn
